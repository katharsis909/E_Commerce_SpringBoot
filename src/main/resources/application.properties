spring.application.name=ecommerce-router
# Useful for logging, monitoring, or differentiating services in a microservice architecture.
!spring.datasource.url=jdbc:h2:mem:testdb
#h2 means h2 db, mem means in-memory, testdb is name of db
spring.datasource.url=jdbc:h2:file:./data/testdb;IFEXISTS=FALSE
spring.datasource.driverClassName=org.h2.Driver
#Why is driverClassName needed?

spring.datasource.username=root
spring.datasource.password=root

!spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#not needed
spring.h2.console.enabled=true
#visually inspect the db
spring.h2.console.path=/h2-console
# at http://localhost:8080/h2-console
#This way, can store in persistence, but also can edit & view in web

spring.jpa.hibernate.ddl-auto=update
#automatically creates the table if it does not exists

spring.main.banner-mode = off
logging.level.root = warn

# The normal process is the catalogue/API router. Start six additional copies
# with --app.role=trie-shard --app.trie-shard=<A|S|CP|BMT|COMMON|RARE>.
app.role=router
app.trie-shards.a=http://localhost:8091
app.trie-shards.s=http://localhost:8092
app.trie-shards.cp=http://localhost:8093
app.trie-shards.bmt=http://localhost:8094
app.trie-shards.common=http://localhost:8095
app.trie-shards.rare=http://localhost:8096
# Enable this only when all six trie-shard processes have been started.
autocomplete.router.bootstrap-enabled=false

autocomplete.sample-rate=1000
autocomplete.top-prefix-limit=10000
autocomplete.suggestions-per-prefix=8
autocomplete.rebuild.cron=0 0 0 * * SUN

# In-memory autocomplete: popularity is estimated from one server-side sample per 1,000 searches.
autocomplete.sample-rate=1000
autocomplete.top-prefix-limit=10000
autocomplete.suggestions-per-prefix=8
autocomplete.rebuild.cron=0 0 0 * * SUN
